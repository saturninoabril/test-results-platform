[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-results-api"
version = "0.4.0"
description = "REST API for managing test execution results from end-to-end testing frameworks"
# readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Test Results API Team" },
]
keywords = ["api", "testing", "playwright", "cypress", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # Core FastAPI dependencies
    "fastapi[standard]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database dependencies
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    "psycopg2-binary>=2.9.0",  # PostgreSQL sync driver for migrations

    # Authentication dependencies
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.25.0",  # For GitHub OAuth
    "python-multipart>=0.0.6",  # For form data

    # Storage dependencies
    "aioboto3>=12.0.0",  # S3-compatible storage
    "minio>=7.2.0",  # MinIO client

    # Utility dependencies
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",  # Structured logging

    # CLI dependencies
    "click>=8.1.0",
    "rich>=13.0.0",  # CLI formatting
]

[project.optional-dependencies]
dev = [
    # Testing dependencies
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "httpx>=0.25.0",  # For test client

    # Development tools
    "ruff>=0.1.0",  # Linting and formatting
    "mypy>=1.7.0",  # Type checking
    "pre-commit>=3.5.0",

    # Database testing
    "pytest-postgresql>=5.0.0",

    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[project.scripts]
test-results-cli = "src.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    # "--cov=src",
    # "--cov-report=term-missing",
    # "--cov-report=html:htmlcov",
    # "--cov-fail-under=90",
]
markers = [
    "contract: Contract tests that validate API specifications",
    "integration: Integration tests with real dependencies",
    "unit: Unit tests for individual components",
    "slow: Tests that take longer to run",
    "external: Tests that require external services",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "S101", "S603", "S607"]
"src/cli/*" = ["B008"]  # Click uses function calls in defaults

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "minio.*",
    "aioboto3.*",
    "pytest_postgresql.*",
    "pytest_minio.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "src/cli/*",  # CLI tools have different coverage requirements
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]