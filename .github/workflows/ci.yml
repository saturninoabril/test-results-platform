name: CI

on:
  pull_request:
    branches: [ main, release/* ]
  push:
    branches: [ main, release/* ]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Run code formatting check
      run: |
        echo "🎨 Checking code formatting..."
        uv run ruff format src/ tests/ --check --diff

    - name: Run linting
      run: |
        echo "🔍 Running code linting..."
        uv run ruff check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Run type checking
      run: |
        echo "🔍 Running type checks..."
        uv run mypy src/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Run unit tests
      run: |
        echo "🧪 Running unit tests..."
        uv run python -m pytest tests/unit/ -v --tb=short --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unit-tests
        name: codecov-unit
        fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_results
          POSTGRES_USER: test_results_user
          POSTGRES_PASSWORD: test_results_password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
        ports:
          - 9000:9000
          - 9001:9001

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Set up MinIO buckets
      run: |
        # Install MinIO client
        curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc
        chmod +x mc
        sudo mv mc /usr/local/bin/

        # Wait for MinIO to be ready and create buckets
        sleep 10
        mc alias set myminio http://localhost:9000 minioadmin minioadmin123
        mc mb myminio/test-artifacts || true
        mc policy set public myminio/test-artifacts || true

    - name: Run database migrations
      run: |
        echo "🗄️ Running database migrations..."
        uv run alembic upgrade head
      env:
        DATABASE_URL: postgresql+asyncpg://test_results_user:test_results_password@localhost:5433/test_results

    - name: Run integration tests
      run: |
        echo "🧪 Running integration tests..."
        uv run python -m pytest tests/integration/ -v --tb=short --cov=src --cov-report=xml --cov-report=term
      env:
        DATABASE_URL: postgresql+asyncpg://test_results_user:test_results_password@localhost:5433/test_results
        STORAGE_TYPE: minio
        MINIO_ENDPOINT: http://localhost:9000
        MINIO_ACCESS_KEY: minioadmin
        MINIO_SECRET_KEY: minioadmin123
        MINIO_BUCKET_PREFIX: test

    - name: Upload coverage to Codecov
      if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: integration-tests
        name: codecov-integration
        fail_ci_if_error: false

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_results
          POSTGRES_USER: test_results_user
          POSTGRES_PASSWORD: test_results_password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
        ports:
          - 9000:9000
          - 9001:9001

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Set up MinIO buckets
      run: |
        # Install MinIO client
        curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc
        chmod +x mc
        sudo mv mc /usr/local/bin/

        # Wait for MinIO to be ready and create buckets
        sleep 10
        mc alias set myminio http://localhost:9000 minioadmin minioadmin123
        mc mb myminio/test-artifacts || true
        mc policy set public myminio/test-artifacts || true

    - name: Run database migrations
      run: |
        echo "🗄️ Running database migrations..."
        uv run alembic upgrade head
      env:
        DATABASE_URL: postgresql+asyncpg://test_results_user:test_results_password@localhost:5433/test_results

    - name: Run contract tests
      run: |
        echo "📋 Running contract tests..."
        uv run python -m pytest tests/contract/ -v --tb=short
      env:
        DATABASE_URL: postgresql+asyncpg://test_results_user:test_results_password@localhost:5433/test_results
        STORAGE_TYPE: minio
        MINIO_ENDPOINT: http://localhost:9000
        MINIO_ACCESS_KEY: minioadmin
        MINIO_SECRET_KEY: minioadmin123
        MINIO_BUCKET_PREFIX: test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, unit-tests, integration-tests, contract-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Build package
      run: |
        echo "📦 Building package..."
        uv build

    - name: Validate build artifacts
      run: |
        echo "🔍 Validating build artifacts..."
        uv run python scripts/validate_build.py

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/
        retention-days: 7