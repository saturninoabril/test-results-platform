name: Fork-Safe CI

on:
  pull_request:
    branches: [ main, release/* ]
    types: [ opened, synchronize, reopened ]

env:
  PYTHON_VERSION: "3.13"

jobs:
  # This workflow is designed to run safely on forked repositories
  # It does not use any secrets and only performs read-only operations

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    # This job validates that the PR is safe to run more privileged workflows

    steps:
    - name: Checkout code (fork-safe)
      uses: actions/checkout@v4
      with:
        # Always checkout the PR head for forks
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Check for suspicious changes
      run: |
        echo "🔍 Checking for suspicious changes..."

        # Check if workflow files have been modified
        if git diff --name-only HEAD~1 | grep -q "\.github/workflows/"; then
          echo "⚠️ Workflow files have been modified"
          echo "workflow_modified=true" >> $GITHUB_OUTPUT
        else
          echo "✅ No workflow files modified"
          echo "workflow_modified=false" >> $GITHUB_OUTPUT
        fi

        # Check for suspicious file patterns
        SUSPICIOUS_FILES=$(git diff --name-only HEAD~1 | grep -E "\.(sh|py|js|ts)$" | head -10)
        if [ -n "$SUSPICIOUS_FILES" ]; then
          echo "📝 Code files modified:"
          echo "$SUSPICIOUS_FILES"
        fi

    - name: Validate Python syntax
      run: |
        echo "🐍 Validating Python syntax..."
        find . -name "*.py" -type f -exec python -m py_compile {} \; || {
          echo "❌ Python syntax errors found"
          exit 1
        }
        echo "✅ Python syntax validation passed"

  basic-tests:
    name: Basic Tests (Fork-Safe)
    runs-on: ubuntu-latest
    needs: security-check

    steps:
    - name: Checkout code (fork-safe)
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv sync --extra dev

    - name: Run basic linting
      run: |
        echo "🔍 Running basic code checks..."
        uv run ruff format src/ tests/ --check --diff
        uv run ruff check src/ tests/

    - name: Run type checking
      run: |
        echo "🔍 Running type checks..."
        uv run mypy src/

    - name: Run unit tests (no external dependencies)
      run: |
        echo "🧪 Running unit tests..."
        # Run only tests that don't require database or external services
        uv run python -m pytest tests/unit/ -v --tb=short -k "not (database or storage or integration)"

  pr-feedback:
    name: PR Feedback
    runs-on: ubuntu-latest
    needs: [security-check, basic-tests]
    if: always()

    steps:
    - name: PR Status Comment
      uses: actions/github-script@v7
      with:
        script: |
          const needs = ${{ toJson(needs) }};
          const securityResult = needs['security-check'].result;
          const testsResult = needs['basic-tests'].result;

          let status = '✅ Ready for review';
          let details = [];

          if (securityResult !== 'success') {
            status = '❌ Security check failed';
            details.push('- Security validation failed - please check for syntax errors');
          }

          if (testsResult !== 'success') {
            status = '❌ Tests failed';
            details.push('- Basic tests failed - please check linting and type errors');
          }

          const body = `## 🔒 Fork-Safe CI Results

          **Status**: ${status}

          This is a preliminary check that runs safely on forked repositories.
          Full CI will run after the PR is reviewed by a maintainer.

          ${details.length > 0 ? '### Issues Found\n' + details.join('\n') : ''}

          ### Next Steps
          ${securityResult === 'success' && testsResult === 'success' ?
            '- ✅ All basic checks passed\n- 🔄 Full CI will run automatically for trusted contributors\n- 👀 External contributors: wait for maintainer approval' :
            '- 🔧 Please fix the issues above\n- 🔄 Push new commits to re-run checks'}

          ---
          *This comment is automatically updated by the fork-safe CI workflow*
          `;

          // Find existing comment to update
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existingComment = comments.data.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('🔒 Fork-Safe CI Results')
          );

          if (existingComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
          }