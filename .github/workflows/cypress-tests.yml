name: 'Reusable Cypress Tests'

on:
  workflow_call:
    inputs:
      # Required inputs
      api-endpoint:
        description: 'Test Results API endpoint URL'
        required: true
        type: string

      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '20'

      # Cypress configuration
      cypress-version:
        description: 'Cypress version to install'
        required: false
        type: string
        default: 'latest'

      test-command:
        description: 'Command to run Cypress tests'
        required: false
        type: string
        default: 'npx cypress run'

      browsers:
        description: 'Browsers to test (json array: ["chrome", "firefox", "edge"])'
        required: false
        type: string
        default: '["chrome"]'

      # Test configuration
      environment-prefix:
        description: 'Prefix for environment names'
        required: false
        type: string
        default: 'ci-cypress'

      suite-name-prefix:
        description: 'Prefix for suite names'
        required: false
        type: string
        default: 'Cypress Tests'

      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'

      # Results configuration
      results-path:
        description: 'Path where test results are stored'
        required: false
        type: string
        default: 'cypress/results'

      upload-artifacts:
        description: 'Whether to upload test artifacts'
        required: false
        type: boolean
        default: true

      additional-tags:
        description: 'Additional tags to apply (comma-separated)'
        required: false
        type: string
        default: ''

      # Cypress specific options
      record:
        description: 'Record tests to Cypress Dashboard'
        required: false
        type: boolean
        default: false

      parallel:
        description: 'Run tests in parallel'
        required: false
        type: boolean
        default: false

    secrets:
      automation-token:
        description: 'Bearer token for Test Results API'
        required: true

      cypress-record-key:
        description: 'Cypress record key for dashboard (optional)'
        required: false

    outputs:
      results-submitted:
        description: 'Whether results were successfully submitted'
        value: ${{ jobs.cypress-tests.outputs.results-submitted }}

      total-tests:
        description: 'Total number of tests executed'
        value: ${{ jobs.cypress-tests.outputs.total-tests }}

      failed-tests:
        description: 'Number of failed tests'
        value: ${{ jobs.cypress-tests.outputs.failed-tests }}

jobs:
  cypress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJson(inputs.browsers) }}

    outputs:
      results-submitted: ${{ steps.submit-results.conclusion == 'success' }}
      total-tests: ${{ steps.count-results.outputs.total }}
      failed-tests: ${{ steps.count-results.outputs.failed }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'

      - name: 📦 Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: 🌲 Install Cypress
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{ inputs.cypress-version }}" != "latest" ]; then
            npm install cypress@${{ inputs.cypress-version }}
          fi
          # Cache Cypress binary
          npx cypress install

      - name: 📁 Prepare results directory
        working-directory: ${{ inputs.working-directory }}
        run: |
          mkdir -p ${{ inputs.results-path }}
          mkdir -p cypress/screenshots
          mkdir -p cypress/videos

      - name: 🧪 Run Cypress tests
        id: run-tests
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: true
        env:
          CYPRESS_BROWSER: ${{ matrix.browser }}
          CYPRESS_RECORD_KEY: ${{ secrets.cypress-record-key }}
        run: |
          # Build Cypress command
          cmd="${{ inputs.test-command }}"
          cmd="$cmd --browser ${{ matrix.browser }}"

          # Add reporter configuration for Mochawesome
          cmd="$cmd --reporter mochawesome"
          cmd="$cmd --reporter-options reportDir=${{ inputs.results-path }},overwrite=false,html=true,json=true,reportFilename=results-${{ matrix.browser }}"

          # Add recording options if enabled
          if [ "${{ inputs.record }}" = "true" ] && [ -n "${{ secrets.cypress-record-key }}" ]; then
            cmd="$cmd --record"
            if [ "${{ inputs.parallel }}" = "true" ]; then
              cmd="$cmd --parallel"
            fi
          fi

          # Run the command
          echo "Running: $cmd"
          eval $cmd || echo "tests_failed=true" >> $GITHUB_OUTPUT

      - name: 📊 Count test results
        id: count-results
        if: always()
        working-directory: ${{ inputs.working-directory }}
        run: |
          results_file="${{ inputs.results-path }}/results-${{ matrix.browser }}.json"
          if [ -f "$results_file" ]; then
            # Extract test counts from Mochawesome JSON results
            total=$(jq '.stats.tests // 0' "$results_file" 2>/dev/null || echo "0")
            failed=$(jq '.stats.failures // 0' "$results_file" 2>/dev/null || echo "0")

            echo "total=$total" >> $GITHUB_OUTPUT
            echo "failed=$failed" >> $GITHUB_OUTPUT
            echo "📊 Test Results: $total total, $failed failed"
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "⚠️ No results file found at: $results_file"
          fi

      - name: 📤 Submit test results
        id: submit-results
        if: always() && hashFiles('${{ inputs.working-directory }}/${{ inputs.results-path }}/results-${{ matrix.browser }}.json') != ''
        uses: ./.github/actions/submit-test-results
        with:
          api-endpoint: ${{ inputs.api-endpoint }}
          automation-token: ${{ secrets.automation-token }}
          framework: 'cypress@${{ inputs.cypress-version }}'
          environment-name: '${{ inputs.environment-prefix }}-${{ matrix.browser }}-ubuntu'
          browser: ${{ matrix.browser }}
          os: 'ubuntu'
          results-file: '${{ inputs.working-directory }}/${{ inputs.results-path }}/results-${{ matrix.browser }}.json'
          suite-name: '${{ inputs.suite-name-prefix }} - ${{ matrix.browser }} - ${{ github.ref_name }}'
          artifacts-path: '${{ inputs.working-directory }}/cypress'
          upload-artifacts: ${{ inputs.upload-artifacts }}
          tags: 'e2e,cypress,${{ matrix.browser }},ubuntu,${{ github.ref_name }}${{ inputs.additional-tags && format(",{0}", inputs.additional-tags) || "" }}'

      - name: 📋 Log submission results
        if: always() && steps.submit-results.conclusion != 'skipped'
        run: |
          echo "🎯 Results Submission Summary:"
          echo "  Framework ID: ${{ steps.submit-results.outputs.framework-id }}"
          echo "  Environment ID: ${{ steps.submit-results.outputs.environment-id }}"
          echo "  Suite ID: ${{ steps.submit-results.outputs.suite-id }}"
          echo "  Results Count: ${{ steps.submit-results.outputs.results-count }}"
          echo "  Artifacts Count: ${{ steps.submit-results.outputs.artifacts-count }}"

      - name: 📎 Upload GitHub Actions artifacts (screenshots & reports)
        if: always() && inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results-${{ matrix.browser }}
          path: |
            ${{ inputs.working-directory }}/${{ inputs.results-path }}/
            ${{ inputs.working-directory }}/cypress/screenshots/
            !${{ inputs.working-directory }}/cypress/videos/
          retention-days: 7

      - name: 🎬 Upload videos separately (if any)
        if: always() && inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.browser }}
          path: ${{ inputs.working-directory }}/cypress/videos/
          retention-days: 7
          if-no-files-found: ignore

      - name: 📊 Generate test summary
        if: always()
        run: |
          echo "## 🌲 Cypress Test Results - ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "${{ inputs.working-directory }}/${{ inputs.results-path }}/results-${{ matrix.browser }}.json" ]; then
            results_file="${{ inputs.working-directory }}/${{ inputs.results-path }}/results-${{ matrix.browser }}.json"
            total=$(jq '.stats.tests // 0' "$results_file")
            passed=$(jq '.stats.passes // 0' "$results_file")
            failed=$(jq '.stats.failures // 0' "$results_file")
            pending=$(jq '.stats.pending // 0' "$results_file")
            duration=$(jq '.stats.duration // 0' "$results_file")

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $total |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $failed |" >> $GITHUB_STEP_SUMMARY
            echo "| Pending | $pending |" >> $GITHUB_STEP_SUMMARY
            echo "| Duration | ${duration}ms |" >> $GITHUB_STEP_SUMMARY
            echo "| Browser | ${{ matrix.browser }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$failed" -gt 0 ]; then
              echo "### ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              # Extract failed test names (simplified)
              jq -r '.results[]?.suites[]?.tests[]? | select(.state == "failed") | "- " + .title' "$results_file" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Failed tests details not available" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ No test results found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ❌ Fail job if tests failed
        if: steps.run-tests.outputs.tests_failed == 'true'
        run: |
          echo "❌ Tests failed for ${{ matrix.browser }}"
          exit 1